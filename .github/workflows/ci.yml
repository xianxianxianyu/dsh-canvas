name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Exercise the native TypeScript engine floor and Node 24.
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
          pnpm exec playwright-core install --with-deps chrome
      - name: Require browser discovery for browser tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { existsSync } from 'node:fs'
          import { homedir } from 'node:os'
          import { browserCandidates, locateBrowser } from './src/host/browser.ts'
          const location = locateBrowser(undefined, browserCandidates(process.platform, process.env, homedir()), existsSync)
          assert.equal(location.kind, 'found', `Browser tests must not skip in CI: ${location.reason}`)
          console.log(`Browser tests use ${location.path}`)
          NODE
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - name: Check public repository privacy
        run: node scripts/check-public.mjs
